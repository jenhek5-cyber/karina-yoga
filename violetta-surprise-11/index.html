8}.gift-list{display:grid;gap:11px;margin:14px 0}.gift-card{display:flex;align-items:center;text-align:left;gap:11px;padding:12px;background:linear-gradient(110deg,#fff0f9,#f1eaff);border:1px solid #f8bee4;border-radius:18px;color:#793170;text-decoration:none}.gift-emoji{font-size:40px;flex:0 0 48px}.gift-card strong{font-size:16px;display:block}.gift-card small{font-size:13px;line-height:1.35;display:block;margin-top:4px}.gift-link{color:#ad2688;font-weight:750}.extra-ending{font-weight:700;color:#a52a87}.doll-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.doll-item{min-width:0;padding:9px 8px 14px;border-radius:20px;border:2px solid #f4c0e9;background:linear-gradient(150deg,#fff9fd,#f4e9ff);box-shadow:0 8px 18px #bb65a526}.doll-frame{height:180px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px;background:#f6e7f1;margin-bottom:9px}.doll-frame img{width:100%;height:100%;object-fit:contain}.doll-item strong{font-size:15px;line-height:1.3;display:block;color:#a52b82}.doll-item span{display:block;font-size:12px;line-height:1.4;margin-top:6px;color:#754671}.combined-dolls{margin:15px 0 18px;background:linear-gradient(145deg,#fff4fc,#f4e5ff);border:2px solid #f5bfe4;padding:10px;border-radius:22px;box-shadow:0 8px 22px #d77abf20}.combined-dolls img{width:100%;height:auto;display:block;border-radius:16px}.combined-dolls figcaption{font-size:13px;color:#a02f87;font-weight:750;margin-top:9px}.combined-dolls figcaption span{color:#ed319b;font-size:18px;padding:0 5px}</head><body><main class="card"><div class="eyebrow">✨ Секретный секрет от крёстного ✨</div><section id="closed"><h1>Виоллета, с 11-летием! 🎉</h1><p>Для самой творческой, талантливой и удивительной именинницы приготовлен особенный сюрприз!</p><button id="present" class="gift" aria-label="Открыть подарок">🎁</button><button id="open" class="btn">Открыть подарок! ✨</button><p style="font-size:14px;color:#a0639b">Нажми и узнай, что внутри! 💝</p></section><section id="opened" class="hide"><h1 style="color:#823678">Та-да-а-ам! 🥳</h1><p>Твой подарок на день рождения:</p><div class="amount">10 000 ₽</div><div style="font-size:48px">💝✨🎉</div><p>На самые заветные мечты, красивые ткани, пряжу, творчество и невероятные приключения!</p><p>Продолжай танцевать, творить, удивлять и радовать мир своими талантами!</p><p style="font-size:18px;font-weight:800;color:#a52a87">С любовью, дядя Женя — твой крёстный папа ❤️</p><p class="fine">Денежный подарок будет отправлен отдельным переводом на твою карту.</p><div class="extra"><div class="extra-tag">🎀 И это ещё не всё!</div><p><strong>Виоллета, тебя ждут ещё два подарка!</strong> Я уже заказал тебе два набора для шитья кукол. Они будут ждать тебя дома к твоему приезду! 🏡💖</p><figure class="combined-dolls"><img src="data:image/webp;base64,UklGRjAYAABXRUJQVlA4ICQYAADQkgCdASpoAQ4BPyWEuFauKD+8KVaLU/AkiWIoLBTRRORP5UBb9S24V8wHmwenL/Cb9DvT1ARygzd0Ae8Lp8mnTAcfyvtoad97D6xNlqFBoJRCjaUSC6dScgyCbXdU5x/M3H1gL2SFBW/7EnvS21vR1A8QurL6RA9SmaQ0mZ0dV9eySCZjCu/+jR/cxcuUdqh9s2i3+glaLrpFYO90EuA+UJIpC3/B9BBY7Poo4fUlly4WKH5nK1GC3VMQNNKeRmAkM/s+xLUsHT4A3sMwPbzSvMHP7QGmngJhIh6Liq7yt06gC8OnSYI0+cVYyWvdaZpzCu3UIt+2UfyIjcrVnZR16uM3eEYHLUEn1f1AHtZ52lyFh9dv8Gz4B3FcJAG1sTrZ7EIN3lWLHn4ZMTqwSZf88Sy2Au5tuAoeuHVeFziJi9yw00ONOShzcBNANcPmP+y0IsLn7k7lu5Gwg6jKf3QXpvfH7bNtOA/5DttXhQUraAvPt2MkehPtQwqR1kTU0dCQADkimWeNGhGVyISN6Pq8JzPCLuxEazRxhm7Eh5JoeQEakHakkc1UdaNXl1Ehv+RIo2bta18d+64iwH0gwme7QN4egKZGdZyy7TTNmTFIc9/lWiYDNXoPJnAPQGiC2KbQzN7pwFbtxPdWt+GNL+OU1sRqhNjuZyUI011r3lI/FQicE5eO9x13zBZ+BKa5AB7ZvofGiNnN7IUwuYBbP4jAZqMj12WRc4dTSZHbZ9lpAake24m36soifF6qFB1gD9iqwpB7enS3R5YQ8PnBYdW6hyroLgwJ5vxcRJadYyp0I0/0ZPWN84StsGmC/pkVwj5x1YIyfc6ZvwJ8hpkwxWLUFRtuY3aPmzV48nvul2mdY3TGT4M3/ogXbFKIrltkrX3D6Qjq/Lti8ZaY1OpofwVqBIG/5F3locsWNte9kbzTb0w43ctFx8slO64M6+azdgIQlJtGL/sNTKJWy3i7H2SUqTVm3KPtfF3f/5+RbfPJ6cPNepwrFMrBsQl2+sexcyEQZPXzs1UH26pqoOCM7HgpsodVjrlLmyDx+UzWMILTCsloRD3VtDhg94FqfNst6ZGV/q2QqqL3+V2vhB2G+78QjW5FL/8fK+t4+mC0IDo9BV3Wow0u .remove(),4500)}}function openGift(){c.classList.add('hide');o.classList.remove('hide');confetti()}document.getElementById('present').onclick=openGift;document.getElementById('open').onclick=openGift;document.getElementById('again').onclick=()=>{o.classList.add('hide');c.classList.remove('hide')}</script></body></html>
