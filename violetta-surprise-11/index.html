<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffdbf1"><title>Сюрприз для Виоллеты 🎁</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;font-family:system-ui,-apple-system,sans-serif;color:#823678;background:radial-gradient(circle at 18% 15%,#fff0ad,transparent 40%),linear-gradient(140deg,#ffdbf1,#e7d8ff 60%,#d0f3ff);text-align:center;padding:18px}.card{background:#ffffffcf;border:2px solid white;border-radius:25px;box-shadow:0 16px 42px #a0499a25;padding:26px 18px;width:100%;max-width:430px;position:relative;z-index:2}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#b44293;margin-bottom:10px}h1{font-size:32px;line-height:1.17;color:#ae2a89;margin:10px 0 15px}p{font-size:16px;line-height:1.6}.gift{font-size:100px;line-height:1.4;display:block;margin:0 auto;cursor:pointer;filter:drop-shadow(0 12px 10px #ac4b8750);animation:bounce 1.8s ease-in-out infinite;border:0;background:none}@keyframes bounce{50%{transform:translateY(-13px) rotate(-6deg)}}.btn{border:0;border-radius:40px;background:linear-gradient(90deg,#f43d92,#9a48dc);color:white;padding:13px 24px;font-size:17px;font-weight:750;box-shadow:0 6px 15px #9c2c8d33;cursor:pointer;margin-top:10px}.amount{font-size:clamp(44px,11vw,69px);font-weight:900;background:linear-gradient(110deg,#ed378b,#f9a31b);color:transparent;background-clip:text;-webkit-background-clip:text;margin:10px 0}.hide{display:none}.fine{font-size:12px;margin-top:12px;color:#8d638a}.confetti{position:fixed;top:-15px;width:9px;height:16px;animation:fall var(--d) linear forwards;left:var(--x);background:var(--c);z-index:5;pointer-events:none}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(700deg);opacity:.3}}.extra{margin-top:22px;padding-top:16px;border-top:2px dashed #f1b0db}.extra-tag{font-size:21px;font-weight:900;color:#ad2988}.gift-list{display:grid;gap:11px;margin:14px 0}.gift-card{display:flex;align-items:center;text-align:left;gap:11px;padding:12px;background:linear-gradient(110deg,#fff0f9,#f1eaff);border:1px solid #f8bee4;border-radius:18px;color:#793170;text-decoration:none}.gift-emoji{font-size:40px;flex:0 0 48px}.gift-card strong{font-size:16px;display:block}.gift-card small{font-size:13px;line-height:1.35;display:block;margin-top:4px}.gift-link{color:#ad2688;font-weight:750}.extra-ending{font-weight:700;color:#a52a87}.doll-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.doll-item{min-width:0;padding:9px 8px 14px;border-radius:20px;border:2px solid #f4c0e9;background:linear-gradient(150deg,#fff9fd,#f4e9ff);box-shadow:0 8px 18px #bb65a526}.doll-frame{height:180px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px;background:#f6e7f1;margin-bottom:9px}.doll-frame img{width:100%;height:100%;object-fit:contain}.doll-item strong{font-size:15px;line-height:1.3;display:block;color:#a52b82}.doll-item span{display:block;font-size:12px;line-height:1.4;margin-top:6px;color:#754671}.combined-dolls{margin:15px 0 18px;background:linear-gradient(145deg,#fff4fc,#f4e5ff);border:2px solid #f5bfe4;padding:10px;border-radius:22px;box-shadow:0 8px 22px #d77abf20}.combined-dolls img{width:100%;height:auto;display:block;border-radius:16px}.combined-dolls figcaption{font-size:13px;color:#a02f87;font-weight:750;margin-top:9px}.combined-dolls figcaption span{color:#ed319b;font-size:18px;padding:0 5px}</head><body><main class="card"><div class="eyebrow">✨ Секретный секрет от крёстного ✨</div><section id="closed"><h1>Виоллета, с 11-летием! 🎉</h1><p>Для самой творческой, талантливой и удивительной именинницы приготовлен особенный сюрприз!</p><button id="present" class="gift" aria-label="Открыть подарок">🎁</button><button id="open" class="btn">Открыть подарок! ✨</button><p style="font-size:14px;color:#a0639b">Нажми и узнай, что внутри! 💝</p></section><section id="opened" class="hide"><h1 style="color:#823678">Та-да-а-ам! 🥳</h1><p>Твой подарок на день рождения:</p><div class="amount">10 000 ₽</div><div style="font-size:48px">💝✨🎉</div><p>На самые заветные мечты, красивые ткани, пряжу, творчество и невероятные приключения!</p><p>Продолжай танцевать, творить, удивлять и радовать мир своими талантами!</p><p style="font-size:18px;font-weight:800;color:#a52a87">С любовью, дядя Женя — твой крёстный папа ❤️</p><p class="fine">Денежный подарок будет отправлен отдельным переводом на твою карту.</p><div class="extra"><div class="extra-tag">🎀 И это ещё не всё!</div><p><strong>Виоллета, тебя ждут ещё два подарка!</strong> Я уже заказал тебе два набора для шитья кукол. Они будут ждать тебя дома к твоему приезду! 🏡💖</p><figure class="combined-dolls"><img src="./dolls.webp" alt="Два подарка для Виоллеты: овечка Тильда плюс новогодняя куколка" width="360" height="270"><figcaption>Овечка Тильда <span>+</span> Новогодняя куколка</figcaption></figure><p class="extra-ending">Пусть твои золотые ручки создадут настоящую сказку! ✂️🧵✨</p></div><button class="btn" id="again">Открыть ещё раз 🎁</button></section></main><script>const c=document.getElementById('closed'),o=document.getElementById('opened');function confetti(){document.querySelectorAll('.confetti').forEach(e=>e.remove());for(let i=0;i<90;i++){let p=document.createElement('i');p.className='confetti';p.style.setProperty('--x',Math.random()*100+'%');p.style.setProperty('--dx',(Math.random()*200-100)+'px');p.style.setProperty('--d',(2.3+Math.random()*2)+'s');p.style.setProperty('--c',['#f03690','#fdba36','#a54ce0','#48bfe8','#5ec99b'][Math.floor(Math.random()*5)]);document.body.append(p);setTimeout(()=>p.remove(),4500)}}function openGift(){c.classList.add('hide');o.classList.remove('hide');confetti()}document.getElementById('present').onclick=openGift;document.getElementById('open').onclick=openGift;document.getElementById('again').onclick=()=>{o.classList.add('hide');c.classList.remove('hide')}</script></body></html>
